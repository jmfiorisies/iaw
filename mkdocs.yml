site_name: "IAW · Implantación de Aplicaciones Web"

theme:
  name: material
  language: es

  icon:
    logo: material/server-network
    repo: fontawesome/brands/github

  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Pasar a modo oscuro

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Pasar a modo claro

markdown_extensions:
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - redirects:
      redirect_maps:
        'tech/apache.md': 'https://jmfiorisies.github.io/tech/apache/'
        'tech/docker.md': 'https://jmfiorisies.github.io/tech/docker/'
        'tech/git.md': 'https://jmfiorisies.github.io/tech/git/'
        'tech/github-actions.md': 'https://jmfiorisies.github.io/tech/github-actions/'
        'tech/http-tls.md': 'https://jmfiorisies.github.io/tech/http-tls/'
        'tech/index.md': 'https://jmfiorisies.github.io/tech/'
        'tech/mariadb.md': 'https://jmfiorisies.github.io/tech/mariadb/'
        'tech/nextcloud.md': 'https://jmfiorisies.github.io/tech/nextcloud/'
        'tech/nginx.md': 'https://jmfiorisies.github.io/tech/nginx/'
        'tech/php-fpm.md': 'https://jmfiorisies.github.io/tech/php-fpm/'
        'tech/python.md': 'https://jmfiorisies.github.io/tech/python/'
        'tech/wordpress.md': 'https://jmfiorisies.github.io/tech/wordpress/'
        'tech/wp-cli.md': 'https://jmfiorisies.github.io/tech/wp-cli/'
        'ud01-arquitectura-web-ssl.md': 'unidades/ud01.md'
        'ud02-apache.md': 'unidades/ud02.md'
        'ud03-nginx.md': 'unidades/ud03.md'
        'ud04-php.md': 'unidades/ud04.md'
        'ud05-python.md': 'unidades/ud05.md'
        'ud06-mariadb-git.md': 'unidades/ud06.md'
        'ud07-wordpress.md': 'unidades/ud07.md'
        'ud08-wpcli.md': 'unidades/ud08.md'
        'ud09-nextcloud.md': 'unidades/ud09.md'
        'ud10-apis-saas.md': 'unidades/ud10.md'
        'ud11-docker.md': 'unidades/ud11.md'
        'ud12-cicd-paas.md': 'unidades/ud12.md'

nav:
  - Inicio: index.md
  - 1er Trimestre:
      - "UD1 · Arquitectura Web, Protocolos y SSL": unidades/ud01.md
      - "UD2 · Servidores Web Clásicos: Apache": unidades/ud02.md
      - "UD3 · Servidores de Alto Rendimiento: Nginx": unidades/ud03.md
  - Referencia Tecnológica:
      - "Árbol tecnológico completo": https://jmfiorisies.github.io/tech/
      - "HTTP / TLS": https://jmfiorisies.github.io/tech/http-tls/
      - "Apache": https://jmfiorisies.github.io/tech/apache/
      - "Nginx": https://jmfiorisies.github.io/tech/nginx/
      - "Docker": https://jmfiorisies.github.io/tech/docker/
  - "🏠 Portal docente": https://jmfiorisies.github.io/
