site_name: "IAW · Implantación de Aplicaciones Web"

theme:
  name: material
  language: es

  icon:
    logo: material/server-network
    repo: fontawesome/brands/github

  features:
    - navigation.indexes
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Pasar a modo oscuro

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Pasar a modo claro

markdown_extensions:
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mapas.js            # visor ampliable de los mapas SVG (docs/iaw/mapas/insertar.py)

extra_css:
  - stylesheets/extra.css
  - stylesheets/mapas.css

plugins:
  - search
  - redirects:
      redirect_maps:
        'tech/apache.md': 'https://jmfiorisies.github.io/tech/apache/'
        'tech/docker.md': 'https://jmfiorisies.github.io/tech/docker/'
        'tech/git.md': 'https://jmfiorisies.github.io/tech/git/'
        'tech/github-actions.md': 'https://jmfiorisies.github.io/tech/github-actions/'
        'tech/http-tls.md': 'https://jmfiorisies.github.io/tech/http-tls/'
        'tech/index.md': 'https://jmfiorisies.github.io/tech/'
        'tech/mariadb.md': 'https://jmfiorisies.github.io/tech/mariadb/'
        'tech/nextcloud.md': 'https://jmfiorisies.github.io/tech/nextcloud/'
        'tech/nginx.md': 'https://jmfiorisies.github.io/tech/nginx/'
        'tech/php-fpm.md': 'https://jmfiorisies.github.io/tech/php-fpm/'
        'tech/python.md': 'https://jmfiorisies.github.io/tech/python/'
        'tech/wordpress.md': 'https://jmfiorisies.github.io/tech/wordpress/'
        'tech/wp-cli.md': 'https://jmfiorisies.github.io/tech/wp-cli/'
        'ud01-arquitectura-web-ssl.md': 'unidades/ud01.md'
        'ud02-apache.md': 'unidades/ud02.md'
        'ud03-nginx.md': 'unidades/ud03.md'
        'ud04-php.md': 'unidades/ud04.md'
        'ud05-python.md': 'unidades/ud05.md'
        'ud06-mariadb-git.md': 'unidades/ud06.md'
        'ud07-wordpress.md': 'unidades/ud07.md'
        'ud08-wpcli.md': 'unidades/ud08.md'
        'ud09-nextcloud.md': 'unidades/ud09.md'
        'ud10-apis-saas.md': 'unidades/ud10.md'
        'ud11-docker.md': 'unidades/ud11.md'
        'ud12-cicd-paas.md': 'unidades/ud12.md'

nav:
  - Inicio: index.md
  - Planificación Docente: planificacion.md
  - "1.ª Evaluación":
      - "UD1 · Arquitectura Web, Protocolos y SSL": unidades/ud01.md
      - "UD2 · Servidores Web Clásicos: Apache": unidades/ud02.md
      - "UD3 · Servidores de Alto Rendimiento: Nginx": unidades/ud03.md
      - "UD4 · Entorno PHP: Nginx + PHP-FPM": unidades/ud04.md
      - "UD5 · Python detrás de Nginx: Gunicorn + Flask": unidades/ud05.md
      - "UD6 · La base de datos (MariaDB) y la configuración en Git": unidades/ud06.md
  # Baterías y prácticas: CIFRADAS con la contraseña del curso (los originales están en Organización,
  # web-protegida/iaw). Se regeneran con Organizacion/web-protegida/publicar.sh IAW
  - 🏋️ Practicar (con contraseña):
      - Baterías de ejercicios:
          - "UD4 · PHP con Nginx y PHP-FPM": unidades/ud04-1-bateria/
          - "UD5 · Python con Nginx y Gunicorn": unidades/ud05-1-bateria/
          - "UD6 · MariaDB y Git": unidades/ud06-1-bateria/
      - Prácticas:
          - "P2 · Radio Marea (UD4–UD6)": practicas/p2-radio-marea/
  - Referencia Tecnológica:
      - "Árbol tecnológico completo": https://jmfiorisies.github.io/tech/
      - "HTTP / TLS": https://jmfiorisies.github.io/tech/http-tls/
      - "Apache": https://jmfiorisies.github.io/tech/apache/
      - "Nginx": https://jmfiorisies.github.io/tech/nginx/
      - "Docker": https://jmfiorisies.github.io/tech/docker/
  - "🏠 Portal docente": https://jmfiorisies.github.io/

# Las páginas cifradas (Practicar) son HTML ya hechos, no .md: que el menú no las tome por enlaces rotos
validation:
  nav:
    not_found: info
